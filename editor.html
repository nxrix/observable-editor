<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://nxrix.github.io/assets/styles/notebook.css">
  <title>Editor</title>
</head>
<body>
  <div style="display:flex;flex-direction:column;min-height:calc(var(--vh) - 64px)">
    <button id="loadButton">Load</button>
    <main style="width:100%;margin:0 auto"></main>
  </div>
  <script type="module">

import * as Kit from "https://cdn.jsdelivr.net/npm/@observablehq/notebook-kit/+esm";
import * as Runtime from "https://cdn.jsdelivr.net/npm/@observablehq/notebook-kit/runtime/+esm";

const compile = (value) => (1, eval)(`"use strict";(\n${value}\n)\n`);

window.Kit = Kit;
window.Runtime = Runtime;

function handleFiles(files) {
  if (files.length === 1 && (
    files[0].type === "text/html" ||
    files[0].name.toLowerCase().endsWith(".html") ||
    files[0].name.toLowerCase().endsWith(".htm")
  )) {
    const file = files[0];

    file.text().then((html) => {
      const notebook = Kit.deserialize(html);
      console.log(notebook);
      const runtime = new Runtime.NotebookRuntime();
      const root = document.querySelector("main");
      const state = {
        root,
        variables: []
      };
      for (const cell of notebook.cells) {
        const definition = Kit.transpile(cell);
        runtime.define(state,{
          ...definition,
          body: compile(definition.body)
        });
      }
    });

    return;
  }
}

loadButton.addEventListener("click", () => {
  const input = document.createElement("input");
  input.type = "file";
  input.multiple = true;
  input.addEventListener("change", () => {
    if (input.files?.length) {
      handleFiles([...input.files]);
    }
  });
  input.click();
});

document.addEventListener("dragover", (event) => {
  event.preventDefault();
  event.dataTransfer.dropEffect = "copy";
});

document.addEventListener("drop", (event) => {
  event.preventDefault();
  const files = [...event.dataTransfer.files];
  if (files.length) {
    handleFiles(files);
  }
});

  </script>
</body>
</html>
