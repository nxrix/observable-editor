  <script id="775" type="application/vnd.observable.javascript">
    canvas = {
      const canvas = document.createElement("canvas");
      canvas.style.maxWidth = "100%";
      canvas.style.imageRendering = "pixelated";
      canvas.style.border = "1px solid #8884";
      canvas.style.borderRadius = "8px";
      const renderer = new THREE.WebGLRenderer({
        context: canvas.getContext("webgl2", {
          preserveDrawingBuffer: true
        }),
        antialias: false
      });
    
      function handleSource(string, errorLine) {
        const lines = string.split("\n");
        const lines2 = [];
        const from = Math.max(errorLine - 6, 0);
        const to = Math.min(errorLine + 6, lines.length);
        for (let i = from; i < to; i++) {
          const line = i + 1;
          lines2.push(`${line === errorLine ? ">" : " "} ${line}: ${lines[i]}`);
        }
        return lines2.join("\n");
      }
    
      function getShaderErrors(gl, shader, type) {
        const status = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
        const shaderInfoLog = gl.getShaderInfoLog(shader) || "";
        const errors = shaderInfoLog.trim();
        if (status && errors === "") return "";
        const errorMatches = /ERROR: 0:(\d+)/.exec(errors);
        if (errorMatches) {
          const errorLine = parseInt(errorMatches[1]);
          return (
            errors + "\n\n" + handleSource(gl.getShaderSource(shader), errorLine)
          );
        } else {
          return errors;
        }
      }
    
      renderer.debug.onShaderError = (
        gl,
        program,
        glVertexShader,
        glFragmentShader
      ) => {
        const programInfoLog = gl.getProgramInfoLog(program) || "";
        const fragmentShaderInfoLog = gl.getShaderInfoLog(glFragmentShader) || "";
    
        const programLog = programInfoLog.trim();
        const fragmentLog = fragmentShaderInfoLog.trim();
    
        if (gl.getProgramParameter(program, gl.LINK_STATUS) === false) {
          const fragmentErrors = getShaderErrors(gl, glFragmentShader, "fragment");
          errors.innerText = fragmentErrors;
          errors.style.color = "red";
        }
      };
    
      const scene = new THREE.Scene();
    
      const vs = `
        varying vec3 vP;
        varying vec3 vW;
        varying vec3 vN;
        varying mat4 vM;
        void main() {
          vP = position;
          vN = normal;
          vW = (modelMatrix*vec4(position,1)).xyz;
          vM = projectionMatrix*modelViewMatrix;
          gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1);
        }`;
    
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(2, 2, 2),
        new THREE.ShaderMaterial({
          vertexShader: vs,
          fragmentShader: "void main(){ gl_FragColor = vec4(0); }",
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: {
            iPerspective: { value: state.perspective },
            iJ: { value: state.julia },
            iC: {
              value: state.c
            }
          }
        })
      );
      canvas.cube = cube;
      scene.add(cube);
    
      /*scene.add(
        new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(2.05, 2.05, 2.05)),
          new THREE.LineBasicMaterial({
            color: 0x111111
          })
        )
      );*/
    
      const perspectiveCamera = new THREE.PerspectiveCamera(
        state.fov,
        1,
        0.125,
        64
      );
      const orthographicCamera = new THREE.OrthographicCamera(
        -1,
        1,
        1,
        -1,
        -8,
        128
      );
      perspectiveCamera.position.set(0, 0, 2);
      orthographicCamera.position.set(0, 0, 2);
      let camera = state.perspective ? perspectiveCamera : orthographicCamera;
    
      canvas.resize = (w, h, r = 1) => {
        renderer.setSize(w, h, true);
        canvas.width = w * r;
        canvas.height = h * r;
        canvas.style.width = w + "px";
        renderer.setPixelRatio(r);
    
        const aspect = w / h;
    
        perspectiveCamera.aspect = aspect;
        perspectiveCamera.zoom = aspect <= 1 ? aspect : 1;
        perspectiveCamera.updateProjectionMatrix();
    
        if (aspect <= 1) {
          const visibleHeight = orthographicCamera.left - orthographicCamera.right;
          orthographicCamera.top = -visibleHeight / aspect / 2;
          orthographicCamera.bottom = visibleHeight / aspect / 2;
        } else {
          const visibleHeight = orthographicCamera.top - orthographicCamera.bottom;
          orthographicCamera.left = (-visibleHeight * aspect) / 2;
          orthographicCamera.right = (visibleHeight * aspect) / 2;
        }
        orthographicCamera.updateProjectionMatrix();
    
        renderer.render(scene, camera);
      };
      canvas.resizeEvent = () => {
        const z = Math.min(window.innerWidth, 512);
        canvas.resize(z, z, devicePixelRatio);
      };
      window.addEventListener("resize", canvas.resizeEvent);
      canvas.resizeEvent();
    
      let needsRender = state.s;
      state.s = false;
    
      const controls = new THREE.OrbitControls(camera, canvas);
      controls.addEventListener("change", () => {
        needsRender = true;
      });
      let disposed = false;
      function animate(t) {
        if (disposed) return;
        if (needsRender) {
          renderer.render(scene, camera);
          needsRender = false;
        }
        requestAnimationFrame(animate);
      }
      animate(0);
    
      invalidation.then(() => {
        disposed = true;
        window.removeEventListener("resize", canvas.resizeEvent);
        renderer.dispose();
        renderer.forceContextLoss();
      });
    
      canvas.update = () => {
        needsRender = true;
      };
      canvas.setFOV = (v) => {
        perspectiveCamera.fov = v;
        perspectiveCamera.updateProjectionMatrix();
        needsRender = true;
      };
      canvas.setCamera = (e) => {
        const target = controls.target.clone();
        const position = camera.position.clone();
        const aspect = canvas.width / canvas.height;
        const halfFovRad = (perspectiveCamera.fov * Math.PI) / 360;
        if (e) {
          const visibleHeight =
            (aspect <= 1
              ? orthographicCamera.right - orthographicCamera.left
              : orthographicCamera.top - orthographicCamera.bottom) /
            orthographicCamera.zoom;
          const newDistance = visibleHeight / (2 * Math.tan(halfFovRad));
          const direction = new THREE.Vector3()
            .subVectors(position, target)
            .normalize();
          const newPosition = target
            .clone()
            .add(direction.multiplyScalar(newDistance));
          perspectiveCamera.position.copy(newPosition);
          perspectiveCamera.updateProjectionMatrix();
        } else {
          const distance = position.distanceTo(target);
          const visibleHeight = 2 * distance * Math.tan(halfFovRad);
    
          orthographicCamera.position.copy(position);
          if (aspect <= 1) {
            orthographicCamera.top = visibleHeight / aspect / 2;
            orthographicCamera.bottom = -visibleHeight / aspect / 2;
            orthographicCamera.left = -visibleHeight / 2;
            orthographicCamera.right = visibleHeight / 2;
          } else {
            orthographicCamera.left = (-visibleHeight * aspect) / 2;
            orthographicCamera.right = (visibleHeight * aspect) / 2;
            orthographicCamera.top = visibleHeight / 2;
            orthographicCamera.bottom = -visibleHeight / 2;
          }
          orthographicCamera.zoom = 1;
          orthographicCamera.updateProjectionMatrix();
        }
        camera = e ? perspectiveCamera : orthographicCamera;
        cube.material.uniforms.iPerspective.value = e;
        controls.object = camera;
        controls.target.copy(target);
        controls.update();
        needsRender = true;
      };
      canvas.uniforms = cube.material.uniforms;
    
      return canvas;
    }
  </script>

  <script id="833" type="application/vnd.observable.javascript">
    {
      const perms = [
        [0, 1, 2],
        [0, 2, 1],
        [1, 0, 2],
        [1, 2, 0],
        [2, 0, 1],
        [2, 1, 0]
      ];
      function sphere(i, size = 256) {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(size, size);
        const d = img.data;
        const perm = perms[i >> 3];
        const sign = i & 7;
        for (let py = 0; py < size; py++) {
          for (let px = 0; px < size; px++) {
            const x = ((px + 0.5) / size) * 2 - 1;
            const y = 1 - ((py + 0.5) / size) * 2;
            const r2 = x * x + y * y;
            if (r2 > 1) continue;
            const z = Math.sqrt(1 - r2);
            let n = [x, y, z];
            n = [
              n[perm[0]] * (sign & 1 ? -1 : 1),
              n[perm[1]] * (sign & 2 ? -1 : 1),
              n[perm[2]] * (sign & 4 ? -1 : 1)
            ];
            const o = (py * size + px) * 4;
            d[o + 0] = (n[0] * 0.5 + 0.5) * 255;
            d[o + 1] = (n[1] * 0.5 + 0.5) * 255;
            d[o + 2] = (n[2] * 0.5 + 0.5) * 255;
            d[o + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const url = canvas.toDataURL();
        const e = html`<div style="text-align:center">
          <img width="32" src="${url}">
          <div style="font-size:13px;font-family:var(--sans-serif);">${i}</div>
        </div>`;
        e.onclick = () => {
          viewof no.value = i;
        };
        return e;
      }
      const o = html`<div></div>`;
      o.style.display = "grid";
      o.style.gridTemplateColumns = "repeat(8,40px)";
      o.style.gap = "4px";
      for (let i = 0; i < 48; i++) o.appendChild(sphere(i));
      return html`<div>${o}</div>`;
    }
  </script>

  <script id="38" type="application/vnd.observable.javascript">
    viewof shader = {
      const shader = `
      #define TAU 6.2831853
      #define EPS ${eps}
      #define MAX_ITER ${max}
      
      #define s(p) (p).${form.o.slice(0, form.s) + "w" + form.o.slice(form.s)}
      #define ns(p) ((p).${permutations[no >> 3]}*vec3(${no & 1 ? -1 : 1},${
        no & 2 ? -1 : 1
      },${no & 4 ? -1 : 1}))
      
      uniform bool iJ;
      uniform vec4 iC;
      
      vec2 iHypersphere(vec4 o, vec4 d, float r) {
        float b = dot(o,d);
        float c = dot(o,o)-r*r;
        float h = b*b-c;
        if (h < 0.0) return vec2(-1);
        h = sqrt(h);
        return vec2(-b-h,-b+h);
      }
      
      vec2 iSphere(vec3 ro, vec3 rd, float r) {
        vec3 oc = ro;
        float b = dot(oc,rd);
        float c = dot(oc,oc)-r*r;
        float h = b*b-c;
        if (h<0.0) return vec2(-1);
        h = sqrt(h);
        return vec2(-b-h,-b+h);
      }
      
      ${mul}
      ${shape.it ? shape.it : ""}
      ${jacobian.f && shape.jf ? shape.jf : shape.af}
      ${four ? f3 : ""}
      
      ${jacobian.n && shape.jn ? shape.jn : four ? an4 : an3}
      
      vec3 turbo(float x) {
        const vec4 r4 = vec4(0.13572138, 4.61539260, -42.66032258, 132.13108234);
        const vec4 g4 = vec4(0.09140261, 2.19418839, 4.84296658, -14.18503333);
        const vec4 b4 = vec4(0.10667330, 12.64194608, -60.58204836, 110.36276771);
        const vec2 r2 = vec2(-152.94239396, 59.28637943);
        const vec2 g2 = vec2(4.27729857, 2.82956604);
        const vec2 b2 = vec2(-89.90310912, 27.34824973);
        x = clamp(x,0.0,1.0);
        vec4 v4 = vec4(1,x,x*x,x*x*x);
        vec2 v2 = v4.zw*v4.z;
        return vec3(
          dot(v4,r4)+dot(v2,r2),
          dot(v4,g4)+dot(v2,g2),
          dot(v4,b4)+dot(v2,b2)
        );
      }
      
      void mainCube(out vec4 fragColor, vec3 ro, vec3 rd) {
        ro *= 2.0;
        vec2 b = iSphere(ro,rd,2.0);
        if (b.x>b.y||b.y<0.0) return;
        float t = max(0.0,b.x);
        for (int i=0;i<512;i++) {
          vec3 p = ro+rd*t;
          ${four ? "vec4 hp;" : ""}
          float d = ${four ? "f3(p,hp)" : "f(p)"};
          if (d < EPS) {
            vec${four ? 4 : 3} n = n(${four ? "hp" : "p"});
            vec4 t = trap(${four ? "hp" : "p"});
            vec3 col = ${
              trap
                ? "(ns(n)*0.5+0.5)*(cos(min(min(min(t.x,t.y),t.z),t.w)*32.0)*0.5+0.5)"
                : "ns(n)*0.5+0.5"
            };
            fragColor = vec4(col,1);
            return;
          }
          t += d;
          if (t>=b.y) {
            ${
              four
                ? "vec3 n = normalize(ro+rd*b.y);fragColor = vec4(n*0.5+0.5,1);"
                : ""
            }
            //fragColor = vec4(0,0,0,pow(1.0-abs(dot(rd,n)*0.5-0.125),64.0));
            return;
          }
        }
      }`;
      const fs = `
        varying vec3 vP;
        varying vec3 vW;
        varying vec3 vN;
        varying mat4 vM;
        uniform bool iPerspective;
        ${shader}
        void main() {
          vec3 ro = cameraPosition;
          vec3 rd;
          if (iPerspective) {
            rd = normalize(vW - ro);
          } else {
            ro = vW;
            rd = normalize(vec3(vM[0][2],vM[1][2],vM[2][2]));
          }
          mainCube(gl_FragColor, ro, rd);
        }
      `;
    
      const material = canvas.cube.material;
      if (material.fragmentShader !== fs) {
        errors.innerText = "No errors :)";
        errors.style.color = "green";
        material.fragmentShader = fs;
        material.needsUpdate = true;
        canvas.update();
      }
      return glsl("shader", shader);
    }
  </script>
