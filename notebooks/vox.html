  <script id="7" type="application/vnd.observable.javascript">
    canvas = {
      const canvas = document.createElement("canvas");
      canvas.style.maxWidth = "100%";
      canvas.style.imageRendering = "pixelated";
      canvas.style.border = "1px solid #8884";
      canvas.style.borderRadius = "8px";
      const renderer = new THREE.WebGLRenderer({
        context: canvas.getContext("webgl2", {
          preserveDrawingBuffer: true,
          antialias: false
        })
      });
    
      function handleSource(string, errorLine) {
        const lines = string.split("\n");
        const lines2 = [];
        const from = Math.max(errorLine - 6, 0);
        const to = Math.min(errorLine + 6, lines.length);
        for (let i = from; i < to; i++) {
          const line = i + 1;
          lines2.push(`${line === errorLine ? ">" : " "} ${line}: ${lines[i]}`);
        }
        return lines2.join("\n");
      }
    
      function getShaderErrors(gl, shader, type) {
        const status = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
        const shaderInfoLog = gl.getShaderInfoLog(shader) || "";
        const errors = shaderInfoLog.trim();
        if (status && errors === "") return "";
        const errorMatches = /ERROR: 0:(\d+)/.exec(errors);
        if (errorMatches) {
          const errorLine = parseInt(errorMatches[1]);
          return (
            errors + "\n\n" + handleSource(gl.getShaderSource(shader), errorLine)
          );
        } else {
          return errors;
        }
      }
    
      renderer.debug.onShaderError = (
        gl,
        program,
        glVertexShader,
        glFragmentShader
      ) => {
        const programInfoLog = gl.getProgramInfoLog(program) || "";
        const fragmentShaderInfoLog = gl.getShaderInfoLog(glFragmentShader) || "";
    
        const programLog = programInfoLog.trim();
        const fragmentLog = fragmentShaderInfoLog.trim();
    
        if (gl.getProgramParameter(program, gl.LINK_STATUS) === false) {
          const fragmentErrors = getShaderErrors(gl, glFragmentShader, "fragment");
          errors.innerText = fragmentErrors;
          errors.style.color = "red";
        }
      };
    
      const scene = new THREE.Scene();
    
      const vs = `
        varying vec3 vP;
        varying vec3 vW;
        varying vec3 vN;
        varying mat4 vM;
        void main() {
          vP = position;
          vN = normal;
          vW = (modelMatrix*vec4(position,1)).xyz;
          vM = projectionMatrix*modelViewMatrix;
          gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1);
        }`;
    
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(2, 2, 2),
        new THREE.ShaderMaterial({
          vertexShader: vs,
          fragmentShader: "void main(){}",
          transparent: true,
          //depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: {
            iPerspective: { value: state.perspective }
          }
        })
      );
      canvas.cube = cube;
      scene.add(cube);
    
      /*scene.add(
        new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(2.05, 2.05, 2.05)),
          new THREE.LineBasicMaterial({
            color: 0x111111
          })
        )
      );*/
    
      const perspectiveCamera = new THREE.PerspectiveCamera(
        state.fov,
        1,
        0.125,
        64
      );
      const orthographicCamera = new THREE.OrthographicCamera(
        -2,
        2,
        2,
        -2,
        -8,
        128
      );
      perspectiveCamera.position.set(2, 2, 4);
      orthographicCamera.position.set(2, 2, 4);
      let camera = state.perspective ? perspectiveCamera : orthographicCamera;
    
      canvas.resize = (w, h, r = 1) => {
        renderer.setSize(w, h, true);
        canvas.width = w * r;
        canvas.height = h * r;
        canvas.style.width = w + "px";
        renderer.setPixelRatio(r);
    
        const aspect = w / h;
    
        perspectiveCamera.aspect = aspect;
        perspectiveCamera.zoom = aspect <= 1 ? aspect : 1;
        perspectiveCamera.updateProjectionMatrix();
    
        if (aspect <= 1) {
          const visibleHeight = orthographicCamera.left - orthographicCamera.right;
          orthographicCamera.top = -visibleHeight / aspect / 2;
          orthographicCamera.bottom = visibleHeight / aspect / 2;
        } else {
          const visibleHeight = orthographicCamera.top - orthographicCamera.bottom;
          orthographicCamera.left = (-visibleHeight * aspect) / 2;
          orthographicCamera.right = (visibleHeight * aspect) / 2;
        }
        orthographicCamera.updateProjectionMatrix();
    
        renderer.render(scene, camera);
      };
      canvas.resizeEvent = () => {
        const z = Math.min(window.innerWidth, 512);
        canvas.resize(z, z, devicePixelRatio);
      };
      window.addEventListener("resize", canvas.resizeEvent);
      canvas.resizeEvent();
    
      let needsRender = state.s;
      state.s = false;
    
      const controls = new THREE.OrbitControls(camera, canvas);
      controls.addEventListener("change", () => {
        needsRender = true;
      });
      let disposed = false;
      function animate(t) {
        if (disposed) return;
        if (needsRender) {
          renderer.render(scene, camera);
          needsRender = false;
        }
        requestAnimationFrame(animate);
      }
      animate(0);
    
      invalidation.then(() => {
        disposed = true;
        window.removeEventListener("resize", canvas.resizeEvent);
        renderer.dispose();
        renderer.forceContextLoss();
      });
    
      canvas.update = () => {
        needsRender = true;
      };
      canvas.setFOV = (v) => {
        perspectiveCamera.fov = v;
        perspectiveCamera.updateProjectionMatrix();
        needsRender = true;
      };
      canvas.setCamera = (e) => {
        const target = controls.target.clone();
        const position = camera.position.clone();
        const aspect = canvas.width / canvas.height;
        const halfFovRad = (perspectiveCamera.fov * Math.PI) / 360;
        if (e) {
          const visibleHeight =
            (aspect <= 1
              ? orthographicCamera.right - orthographicCamera.left
              : orthographicCamera.top - orthographicCamera.bottom) /
            orthographicCamera.zoom;
          const newDistance = visibleHeight / (2 * Math.tan(halfFovRad));
          const direction = new THREE.Vector3()
            .subVectors(position, target)
            .normalize();
          const newPosition = target
            .clone()
            .add(direction.multiplyScalar(newDistance));
          perspectiveCamera.position.copy(newPosition);
          perspectiveCamera.updateProjectionMatrix();
        } else {
          const distance = position.distanceTo(target);
          const visibleHeight = 2 * distance * Math.tan(halfFovRad);
    
          orthographicCamera.position.copy(position);
          if (aspect <= 1) {
            orthographicCamera.top = visibleHeight / aspect / 2;
            orthographicCamera.bottom = -visibleHeight / aspect / 2;
            orthographicCamera.left = -visibleHeight / 2;
            orthographicCamera.right = visibleHeight / 2;
          } else {
            orthographicCamera.left = (-visibleHeight * aspect) / 2;
            orthographicCamera.right = (visibleHeight * aspect) / 2;
            orthographicCamera.top = visibleHeight / 2;
            orthographicCamera.bottom = -visibleHeight / 2;
          }
          orthographicCamera.zoom = 1;
          orthographicCamera.updateProjectionMatrix();
        }
        camera = e ? perspectiveCamera : orthographicCamera;
        cube.material.uniforms.iPerspective.value = e;
        controls.object = camera;
        controls.target.copy(target);
        controls.update();
        needsRender = true;
      };
      canvas.uniforms = cube.material.uniforms;
    
      return canvas;
    }
  </script>

  <script id="23" type="application/vnd.observable.javascript">
    viewof shader = {
      const shader = `
      #define TAU 6.2831853
      #define EPS 0.001
    
      #define max3v(v) max(max(v.x,v.y),v.z)
      #define min3v(v) min(min(v.x,v.y),v.z)
    
      vec3 turbo(float x) {
        const vec4 r4 = vec4(0.13572138, 4.61539260, -42.66032258, 132.13108234);
        const vec4 g4 = vec4(0.09140261, 2.19418839, 4.84296658, -14.18503333);
        const vec4 b4 = vec4(0.10667330, 12.64194608, -60.58204836, 110.36276771);
        const vec2 r2 = vec2(-152.94239396, 59.28637943);
        const vec2 g2 = vec2(4.27729857, 2.82956604);
        const vec2 b2 = vec2(-89.90310912, 27.34824973);
        x = clamp(x,0.0,1.0);
        vec4 v4 = vec4(1,x,x*x,x*x*x);
        vec2 v2 = v4.zw*v4.z;
        return vec3(
          dot(v4,r4)+dot(v2,r2),
          dot(v4,g4)+dot(v2,g2),
          dot(v4,b4)+dot(v2,b2)
        );
      }
    
      const vec3 l = normalize(vec3(1,3,2));
      const vec3 size = vec3(${size});
      const ivec3 isize = ivec3(size);
      const vec3 size2 = size/2.0;
      const vec3 size25 = size2-0.5;
      const int max_steps = int(max(max(size.x,size.y),size.z))*3+3;
    
      ${f}
    
      #define S ${shading}
      #define A ${ambient.toPrecision(2)}
    
      float shadow(vec3 p, vec3 n, vec3 rd) {
        vec3 ro = p + n * EPS;
        vec3 st = sign(rd);
        vec3 ir = 1.0/rd;
        vec3 td = abs(ir);
        vec3 v = floor(ro);
        vec3 tmax = (v + step(0.0, st) - ro) * ir;
        for (int i=0;i<max_steps;++i) {
          if (any(lessThan(v,vec3(-1)))||any(greaterThanEqual(v,size+1.0))) return 1.0;
          if (
            all(greaterThanEqual(v, vec3(0.0))) &&
            all(lessThan(v, size))
          ) {
            if (f(v).a >= 1.0) return 0.0;
          }
          vec3 m = step(tmax.xyz,tmax.yzx)*step(tmax.xyz,tmax.zxy);
          tmax += td*m;
          v += st*m;
        }
        return 1.0;
      }
    
      float transmittance(vec3 p, vec3 n, vec3 rd) {
        vec3 ro = p + n * EPS;
        vec3 st = sign(rd);
        vec3 ir = 1.0/rd;
        vec3 td = abs(ir);
        vec3 v = floor(ro);
        vec3 tmax = (v + step(0.0, st) - ro) * ir;
        float T = 1.0;
        for (int i = 0; i < max_steps; ++i) {
          if (any(lessThan(v,vec3(-1)))||any(greaterThanEqual(v,size+1.0))) break;
          if (all(greaterThanEqual(v,vec3(0)))&&all(lessThan(v,size))) {
            vec4 d = f(v);
            if (d.a > 0.0) {
              T *= (1.0 - clamp(d.a,0.0,1.0));
              if (T < 0.01) return 0.0;
            }
          }
          vec3 m = step(tmax.xyz, tmax.yzx) * step(tmax.xyz, tmax.zxy);
          tmax += td * m;
          v += st * m;
        }
        return T;
      }
    
      float traverse(vec3 ro, vec3 rd, out vec4 vox, out vec3 nrm) {
        vec3 st = sign(rd);
        vec3 ir = 1.0/rd;
        //vec3 ir = 1.0/(rd+1.0-abs(st));
        vec3 td = abs(ir);
        vec3 v = floor(ro);
        vec3 tmax = (v + step(0.0, st) - ro) * ir;
        float ct = -1.0;
        nrm = -st;
        for (int i=0;i<max_steps;++i) {
          if (any(lessThan(v,vec3(-1)))||any(greaterThanEqual(v,size+1.0))) return -1.0;
          if (all(greaterThanEqual(v,vec3(0)))&&all(lessThan(v,size))) {
            vec4 d = f(v);
            if (d.a > 0.0) {
              #if S == 3
                float t = transmittance(ro+rd*ct,nrm,l);
                d.rgb *= max(dot(nrm,l),0.0)*t*(1.0-A)+A;
                //if (t!=0.0&&d.a<1.0) d.a = 0.0;
              #elif S > 0
                float diff = max(dot(nrm,l),0.0);
                #if S == 2
                  if (d.a >= 1.0) diff *= shadow(ro+rd*ct,nrm,l);
                #endif
                d.rgb *= diff*(1.0-A)+A;
              #endif
              float a = clamp(d.a, 0.0, 1.0);
              vox.rgb += d.rgb * a * (1.0 - vox.a);
              vox.a   += a * (1.0 - vox.a);
              if (vox.a >= 1.0) return ct;
            }
          }
          vec3 m = step(tmax.xyz,tmax.yzx)*step(tmax.xyz,tmax.zxy);
          ct = dot(tmax,m);
          tmax += td*m;
          v += st*m;
          nrm = -st*m;
        }
        return ct;
      }
    
      void mainCube(out vec4 fragColor, vec3 ro, vec3 rd) {
        ro *= size2;
        ro += size2;
        vec3 ir = 1.0/rd;
        vec3 t1 =      -ro *ir;
        vec3 t2 = (size-ro)*ir;
        vec3 n = min(t1,t2);
        vec3 f = max(t1,t2);
        float tmin = max(max(n.x,n.y),n.z);
        float tmax = min(min(f.x,f.y),f.z);
        vec3 e = ro+rd*(max(tmin,0.0)-EPS);
        vec4 col;
        vec3 nrm;
        float t = traverse(e,rd,col,nrm);
        e += rd*t;
        if (t==-1.0) {
          e = ro+rd*(tmax-EPS);
          vec3 abs_p = abs(e-size2);
          vec2 uv;
          if (abs_p.x > abs_p.y && abs_p.x > abs_p.z) {
            uv = e.yz;
          } else if (abs_p.y > abs_p.x && abs_p.y > abs_p.z) {
            uv = e.xz;
          } else {
            uv = e.xy;
          }
          vec3 m = step(f.xyz,f.yzx)*step(f.xyz, f.zxy);
          nrm = -sign(rd) * m;
          float check = mod(floor(uv.x/size.x*8.0)+floor(uv.y/size.z*8.0),2.0);
          float bg = (check*0.16+0.61);
          #if S > 0
            float diff = max(dot(nrm,l),0.0);
            #if S == 2
              diff *= shadow(e,nrm,l);
            #elif S == 3
              diff *= transmittance(e,nrm,l);
            #endif
            bg *= diff*(1.0-A)+A;
          #endif
          col.rgb += bg * (1.0 - col.a);
        }
        fragColor = vec4(col.xyz,1);
      }`;
      const fs = `
        varying vec3 vP;
        varying vec3 vW;
        varying vec3 vN;
        varying mat4 vM;
        uniform bool iPerspective;
        ${shader}
        void main() {
          vec3 ro = cameraPosition;
          vec3 rd;
          if (iPerspective) {
            rd = normalize(vW - ro);
          } else {
            ro = vW;
            rd = normalize(vec3(vM[0][2],vM[1][2],vM[2][2]));
          }
          mainCube(gl_FragColor, ro, rd);
        }
      `;
    
      const material = canvas.cube.material;
      if (material.fragmentShader !== fs) {
        errors.innerText = "No errors :)";
        errors.style.color = "green";
        material.fragmentShader = fs;
        material.needsUpdate = true;
        canvas.update();
      }
      return glsl("shader", shader);
    }
  </script>

  <script id="30" type="application/vnd.observable.javascript">
    glsl = (l = "", t) => {
      return Object.assign(md`\`${l} = glsl(~)\``, { value: t });
      const c = md`\`\`\`glsl\n${t.trim()}\n\`\`\``;
      c.style.margin = "0";
      c.style.padding = "8px";
      const e = html`<div>${c}</div>`;
      e.style.width = "fit-content";
      e.style.maxWidth = "100%";
      e.style.maxHeight = "400px";
      e.style.overflow = "auto";
      e.style.borderRadius = "4px";
      e.style.border = "1px solid #8884";
      e.value = t;
      return e;
    }
  </script>
