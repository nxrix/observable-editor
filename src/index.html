<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./favicon.ico">
  <link rel="stylesheet" href="./assets/css/notebook.css">
  <link rel="stylesheet" href="./assets/css/theme.css">
  <script src="./assets/js/theme.js"></script>
  <title>Editor</title>
</head>
<body style="padding:0">
  <div style="display:flex;align-items:center;gap:8px;max-width:calc(var(--max-width) + 48px);height:32px;margin:0 auto;padding:32px 24px 0 24px;">
    <a href="./notebooks.html">< Back</a>
    <button id="saveButton" style="font-family:inherit">Save</button>
  </div>
  <div style="display:flex;flex-direction:column;min-height:calc(var(--vh) - 64px)">
    <main style="position:relative;width:100%;max-width:none;margin:0 auto">
      <iframe id="worker" src="./worker.html" frameborder="0" style="width:100%;min-height:calc(var(--vh) - 64px);margin-bottom:-64px"></iframe>
      <div id="overlay" style="position:absolute;inset:15px 0;width:100%;max-width:calc(var(--max-width) + 48px);height:fit-content;margin:0 auto;z-index:1;min-height:calc(var(--vh) - 15px - 112px - 64px);pointer-events:none"></div>
    </main>
    <footer style="width:100%;max-width:var(--max-width);margin:auto auto 0 auto;z-index:1">
      <div style="height:24px;display:flex;margin:0px 24px 24px 24px">
        <div style="margin:auto 0;font-family:var(--sans-serif);font-size:13px"></div>
        <div style="background:var(--theme-background);display:flex;height:100%;aspect-ratio:3;margin-left:auto;outline:1px solid var(--theme-foreground-faintest);border-radius:12px"></div>
      </div>
    </footer>
  </div>
  <script type="module" src="./assets/js/index.js"></script>
</body>
</html>
